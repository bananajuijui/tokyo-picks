<style>
/* Layout: list + sticky map side by side on wide screens; on phones a List/Map switch with a full-height map. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --ink:#1b2333; --muted:#5d6678; --line:#dfe2e8; --chip:#e8ebf0;
  --accent:#23406b; --accent-ink:#ffffff; --yamanote:#80c241; --mapbg:#e9ecef; --shadow:0 1px 2px rgba(20,30,50,.06),0 6px 20px rgba(20,30,50,.08);
  --c-eat:#d9472b; --c-shop:#7a4cc2; --c-buy:#c08a00; --c-stay:#2a78b8; --c-see:#22916a; --c-move:#56677d; --c-info:#bf3d7a;
  --display:"Zen Kaku Gothic New", "Hiragino Sans", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --body:-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Hiragino Sans", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --hdr:0px; --tilefilter:none;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151d; --surface:#1a202b; --ink:#e7eaf0; --muted:#9aa3b5; --line:#2b3342; --chip:#252d3b;
  --accent:#8fb3ec; --accent-ink:#0f1520; --yamanote:#7dbb45; --mapbg:#1c222c; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
  --c-eat:#ff7a5c; --c-shop:#b18cf0; --c-buy:#e8b730; --c-stay:#5fa9e6; --c-see:#4cc596; --c-move:#93a3b8; --c-info:#ee74ac; --tilefilter:brightness(.72) contrast(1.1) saturate(.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151d; --surface:#1a202b; --ink:#e7eaf0; --muted:#9aa3b5; --line:#2b3342; --chip:#252d3b;
  --accent:#8fb3ec; --accent-ink:#0f1520; --yamanote:#7dbb45; --mapbg:#1c222c; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
  --c-eat:#ff7a5c; --c-shop:#b18cf0; --c-buy:#e8b730; --c-stay:#5fa9e6; --c-see:#4cc596; --c-move:#93a3b8; --c-info:#ee74ac; --tilefilter:brightness(.72) contrast(1.1) saturate(.7); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:1000;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:900;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding-block:12px 8px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
h1{font:900 22px/1.1 var(--display);margin:0;letter-spacing:.01em}
h1 .loop{display:inline-block;width:.62em;height:.62em;border:3px solid var(--yamanote);border-radius:50%;margin-right:.3em;vertical-align:.02em}
.count{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
.search{flex:1 1 220px;min-width:0;display:flex;gap:8px}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;font-size:16px}
.savedbtn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.savedbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:4px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid transparent;background:var(--chip);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--cc,var(--muted))}
.chip .n{font:500 11px var(--mono);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--surface);border-color:var(--cc,var(--accent));box-shadow:inset 0 0 0 1px var(--cc,var(--accent))}
.subchips .chip{font-size:12.5px;padding:4px 10px;background:transparent;border-color:var(--line)}
.subchips:empty{display:none}

main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:0;height:calc(100% - var(--hdr))}
#listPane{overflow-y:auto;padding-block:14px 90px;min-width:0}
#mapPane{position:relative;min-width:0;border-left:1px solid var(--line)}
#map{position:absolute;inset:0;background:var(--mapbg)}
.group{margin-bottom:22px}
.group h2{font:700 13px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 2px 10px;display:flex;align-items:center;gap:8px}
.group h2 .dot{width:9px;height:9px;border-radius:50%;background:var(--cc)}
.group h3{font:700 15px var(--display);margin:14px 2px 8px;color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;transition:transform .15s,box-shadow .15s}
.card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.card.hl{outline:2px solid var(--cc)}
.thumb{aspect-ratio:4/3;width:100%;max-width:100%;background:var(--chip) center/cover no-repeat;position:relative}
.thumb.ph{display:grid;place-items:center;font:900 30px var(--display);color:var(--cc);background:linear-gradient(135deg,var(--chip),var(--bg))}
.badges{position:absolute;left:8px;bottom:8px;display:flex;gap:4px;flex-wrap:wrap}
.badge{font:500 10.5px var(--mono);background:rgba(15,20,30,.72);color:#fff;border-radius:6px;padding:2px 6px}
.heart{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(15,20,30,.55);color:#fff;display:grid;place-items:center;cursor:pointer;font-size:16px;line-height:1}
.heart[aria-pressed="true"]{background:var(--c-eat)}
.cbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.sub{font:500 11px var(--mono);color:var(--cc);text-transform:uppercase;letter-spacing:.04em}
.cname{font:700 15.5px/1.3 var(--display);margin:0;text-wrap:balance}
.jp{font-size:12.5px;color:var(--muted)}
.cdesc{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.empty{padding:40px 8px;color:var(--muted);text-align:center}

/* detail sheet */
#sheetBg{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:1100}
#sheet{position:fixed;z-index:1101;background:var(--surface);box-shadow:var(--shadow);overflow-y:auto;
  right:0;top:0;bottom:0;width:min(520px,100%);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.shead{position:sticky;top:0;z-index:2;display:flex;justify-content:flex-end;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px 12px;pointer-events:none}
.shead button{pointer-events:auto;border:0;border-radius:999px;background:rgba(15,20,30,.62);color:#fff;height:36px;min-width:36px;padding:0 12px;cursor:pointer;font-size:14px}
.shero{margin-top:-56px;width:100%;max-height:min(62vh,560px);object-fit:cover;display:block;background:var(--chip)}
.sbody{padding:16px max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sbody h2{font:900 23px/1.25 var(--display);margin:0;text-wrap:balance}
.sbody p{margin:0;white-space:pre-line}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px}
.meta dt{color:var(--muted);font:500 11.5px/1.9 var(--mono);text-transform:uppercase}
.meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
.warn{font-size:12.5px;color:var(--muted);background:var(--chip);border-radius:8px;padding:8px 10px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:10px 14px;text-decoration:none;font-weight:600;font-size:14px;border:1px solid var(--line);color:var(--ink);background:var(--bg);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.places{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.places a{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);font-size:14px}
.places a span:last-child{color:var(--accent);font:500 12px var(--mono);white-space:nowrap}
.src{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.src a{color:var(--accent)}
.pcred{font-size:11.5px;color:var(--muted);padding:6px 20px 0;overflow-wrap:anywhere}.pcred a{color:inherit}

/* map */
.leaflet-container{font:13px var(--body);background:var(--mapbg)}
.leaflet-popup-content{margin:10px 12px}
.pop b{font:700 14px var(--display);display:block;margin-bottom:2px}
.pop button{margin-top:6px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12.5px}
.stn{font:500 10.5px var(--mono);color:var(--muted);background:transparent;border:0;box-shadow:none;padding:0;white-space:nowrap;text-shadow:0 0 3px var(--mapbg),0 0 3px var(--mapbg)}
.stn::before{display:none}
#map.nolbl .stn{display:none}
.leaflet-tile-pane{filter:var(--tilefilter,none)}
.mapnote{position:absolute;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:800;background:var(--surface);color:var(--muted);font-size:12px;border-radius:8px;padding:6px 10px;box-shadow:var(--shadow);max-width:calc(100% - 20px)}
.legend{position:absolute;right:10px;top:10px;z-index:800;background:var(--surface);border-radius:10px;padding:8px 10px;box-shadow:var(--shadow);font-size:12px;display:flex;flex-direction:column;gap:3px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--cc)}

/* phone switch */
.switch{display:none}
@media (max-width:820px){
  main{display:block;height:auto}
  #listPane{overflow:visible;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}

"n": "How the new tax refund works (3 steps)",
"j": "日本全新退稅制度 / 先付後退",
"d": "1) Show your passport when you buy; the store registers it with its refund company. 2) At the airport, verify first: scan your passport at a kiosk, or (at Narita, Haneda, Kansai, Chubu, Fukuoka, New Chitose, Naha) use the airport Wi-Fi + Visit Japan Web. 3) Pick your refund method online; a credit-card refund takes hours to 5 business days and can be done 90–180 days after you get home. Cash-refund kiosks (with a fee) at 8 airports. In short, \"pay first, refund later\": you pay the tax-included price (demo video: JPrefund at 3COINS). Before the trip, register on the four refund platforms and carry your passport or Visit Japan Web tax-free QR code.",
"by": "@yyvesl, @like.japan, @airi18.12",
"li": [],

"tr": {
"zh": {
"n": "新退稅制度怎麼用（3步驟）",
"d": "1）購物時出示護照，店家向退稅公司登錄。2）在機場先確認：在kiosk掃描護照，或（成田、羽田、關西、中部、福岡、新千歲、那霸）用機場Wi-Fi＋Visit Japan Web。3）線上選擇退款方式；信用卡退款需數小時到5個工作天，回國後90–180天內都可辦。8座機場有現金退稅機（收手續費）。簡單說就是「先付後退」：先付含稅價（示範影片：3COINS的JPrefund）。出發前先註冊四大退稅平台，帶護照或Visit Japan Web免稅QR碼。"
},
"ja": {
"n": "新しい免税制度の流れ（3ステップ）",
"d": "①購入時にパスポートを提示し、店が還付会社に登録。②空港で確認：キオスクでパスポートをスキャン、または（成田・羽田・関西・中部・福岡・新千歳・那覇）空港Wi-Fi＋Visit Japan Web。③オンラインで還付方法を選択。カード還付は数時間〜5営業日、帰国後90〜180日以内でも可。8空港に現金還付機（手数料あり）。要は「先払い・後還付」。"
}

function hlMarker(id,on){const m=markers[id]; if(m) m.setStyle({radius:on?12:8}); }
function hlCard(id,on){const c=document.querySelector('.card[data-id="'+id+'"]'); if(c) c.classList.toggle('hl',on);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-open]'); if(b) openSheet(+b.dataset.open);});

/* ---------- detail ---------- */
let lastFocus=null, openId=null;
function openSheet(id){
  const it=items[id]; if(openId===null) lastFocus=document.activeElement; openId=id;
  const sh=$('#sheet'); sh.style.setProperty('--cc','var('+CV[it.c]+')');
  const refs=(it.refs&&it.refs.length?it.refs:(it.src?[it.src]:[]));
  const src=refs.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace('https://www.',''))}</a>`).join('<br>');
  const tb=it.tb?`<div class="block"><h3>${esc(L().tabelog)}</h3><div class="tbrow"><span class="tbscore">★ ${esc(it.tb.s)}<small>${esc(it.tb.n)} ${esc(L().reviews)}</small></span>
      <span class="tbprice">${it.tb.dn&&it.tb.dn!=='-'?`<span>🌙 ${esc(L().dinner)} ${esc(it.tb.dn)}</span>`:''}${it.tb.ln&&it.tb.ln!=='-'?`<span>☀️ ${esc(L().lunch)} ${esc(it.tb.ln)}</span>`:''}</span></div>
      <a class="btn" href="${esc(it.tb.u)}" target="_blank" rel="noopener" style="align-self:flex-start">${esc(L().open)}</a></div>`:'';
  const info=(it.h?`<div class="block"><h3>🕒 ${esc(L().hours)}</h3><p>${esc(TX(it.h))}</p>${it.tb?`<span class="note">${esc(L().checked)}</span>`:''}</div>`:'')
    +(it.tip?`<div class="block"><h3>📌 ${esc(L().tip)}</h3><p>${esc(TX(it.tip))}</p></div>`:'')
    +(it.cs?`<div class="block"><h3>💬 ${esc(L().cs)}</h3><p>${esc(TX(it.cs))}</p></div>`:'');
  const gal=it.g&&it.g.length?`<div class="block"><h3>📷 ${esc(L().gal)} · ${esc(L().photos(it.g.length))}</h3><div class="gal">${it.g.map((f,k)=>`<button data-g="${k}" aria-label="${esc(L().photo)} ${k+1}" data-bg="${f}"></button>`).join('')}</div></div>`:'';
  sh.innerHTML=`<div class="shead"><button id="sSave" aria-pressed="${saved.has(it.id)}">${saved.has(it.id)?L().savedB:L().save}</button><button id="sClose" aria-label="Close">✕</button></div>
   ${it.tg&&it.tg.length?slides(it.tg,N(it),'ssl'):it.img?`<img class="shero" src="${it.img}" alt="${esc(N(it))}">`:'<div style="height:56px"></div>'}
   ${it.tp?`<div class="pcred"><a href="${esc(it.tp)}" target="_blank" rel="noopener">${esc(L().tbph)} ↗</a></div>`:''}
   ${it.pc?`<div class="pcred">${esc(L().photo)}: <a href="${esc(it.pu)}" target="_blank" rel="noopener">${esc(it.pc)}</a></div>`:''}
   <div class="sbody">
     <span class="sub" style="color:var(--cc)">${esc(CN(it.c))} · ${esc(SN(it))}${it.ar?' · '+esc(AR(it)):''}</span>
     <h2 id="sTitle">${esc(N(it))}</h2>
     ${it.j?`<div class="jp" style="font-size:15px">${esc(it.j)}</div>`:''}
     <p>${esc(D(it))}</p>
     ${tb}${info}${gal}
     ${it.li&&it.li.length?`<ul class="places">${it.li.map(n=>`<li><a href="${gq(n)}" target="_blank" rel="noopener"><span>${esc(n)}</span><span>${esc(L().map)} ↗</span></a></li>`).join('')}</ul>`:''}
     <dl class="meta">
       ${it.a?`<dt>${esc(L().addr)}</dt><dd>${esc(it.a)}</dd>`:''}
       <dt>${esc(L().loc)}</dt><dd>${esc(it.ll?(it.ap?L().locApprox:L().locPin):L().locNone)}</dd>
       <dt>${esc(L().from)}</dt><dd>${esc(it.by)}</dd>
     </dl>
     <div class="actions">
       ${(it.ll||it.a||(it.j&&it.c!=='Info & Tips'))&&!(it.li&&it.li.length&&!it.ll)?`<a class="btn primary" href="${gmaps(it)}" target="_blank" rel="noopener">${esc(L().gmaps)}</a>`:''}
       ${it.ll&&map?`<button class="btn" id="sShow">${esc(L().show)}</button>`:''}
       ${refs.map((u,k)=>`<a class="btn" href="${esc(u)}" target="_blank" rel="noopener">${esc(refs.length>1?L().post(k+1):L().orig)}</a>`).join('')}
     </div>
     <div class="src">${esc(refs.length>1?L().refs(refs.length):L().ref)}:<br>${src}</div>
   </div>`;
  $('#sheetBg').hidden=false; sh.hidden=false;
  // lazy-load gallery thumbnails as they scroll into view
  const gb=[...sh.querySelectorAll('[data-bg]')];
  if('IntersectionObserver' in window){ const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.style.backgroundImage=`url('${e.target.dataset.bg}')`;io.unobserve(e.target)}}),{root:null,rootMargin:'200px'}); gb.forEach(b=>io.observe(b)); }
  else gb.forEach(b=>b.style.backgroundImage=`url('${b.dataset.bg}')`);
  $('#sClose').onclick=closeSheet; $('#sClose').focus({preventScroll:true});
  $('#sSave').onclick=()=>{toggleSave(it.id); $('#sSave').setAttribute('aria-pressed',saved.has(it.id)); $('#sSave').textContent=saved.has(it.id)?L().savedB:L().save;};
  sh.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>openLB(it.g,+b.dataset.g));
  if(it.tg&&it.tg.length){ wireSlides(sh); sh.querySelectorAll('.ssl .trk img').forEach(im=>im.onclick=()=>openLB(it.tg,+im.dataset.k)); }
  const sb=$('#sShow'); if(sb) sb.onclick=()=>{closeSheet(); setView('map'); mapTouched=true; map.setView(it.ll,16); setTimeout(()=>markers[it.id]&&markers[it.id].openPopup(),250);};
}
function closeSheet(){ $('#sheet').hidden=true; $('#sheetBg').hidden=true; openId=null; if(lastFocus&&lastFocus.focus) lastFocus.focus(); }
$('#sheetBg').onclick=closeSheet;

/* ---------- lightbox ---------- */
let lbList=[], lbI=0;
function showLB(){ $('#lbImg').src=lbList[lbI]; $('#lbCount').textContent=(lbI+1)+' / '+lbList.length; }
function openLB(list,i){ lbList=list; lbI=i; showLB(); $('#lb').hidden=false; $('#lbClose').focus({preventScroll:true}); }
function closeLB(){ $('#lb').hidden=true; $('#lbImg').removeAttribute('src'); }
const stepLB=d=>{ lbI=(lbI+d+lbList.length)%lbList.length; showLB(); };
$('#lbPrev').onclick=e=>{e.stopPropagation();stepLB(-1)}; $('#lbNext').onclick=e=>{e.stopPropagation();stepLB(1)}; $('#lbClose').onclick=closeLB;
$('#lb').onclick=e=>{ if(e.target.id==='lb') closeLB(); };
let tx=null; $('#lb').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('#lb').addEventListener('touchend',e=>{ if(tx===null) return; const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>40) stepLB(dx<0?1:-1); tx=null; });
document.addEventListener('keydown',e=>{
  if(!$('#lb').hidden){ if(e.key==='Escape') closeLB(); else if(e.key==='ArrowRight') stepLB(1); else if(e.key==='ArrowLeft') stepLB(-1); return; }
  if(e.key==='Escape'&&!$('#sheet').hidden) closeSheet();
});

function toggleSave(id){ saved.has(id)?saved.delete(id):saved.add(id); persist();
  document.querySelectorAll('.card[data-id="'+id+'"] .heart').forEach(h=>{h.setAttribute('aria-pressed',saved.has(id));h.textContent=saved.has(id)?'♥':'♡'});
  if(st.saved) update(); }

/* ---------- view switch (phone) ---------- */
function setView(v){ document.body.classList.toggle('showMap',v==='map'); document.body.classList.toggle('showList',v!=='map');
  $('#vList').setAttribute('aria-pressed',v!=='map'); $('#vMap').setAttribute('aria-pressed',v==='map');
  if(map) setTimeout(()=>map.invalidateSize(),50); }
$('#vList').onclick=()=>setView('list'); $('#vMap').onclick=()=>setView('map');

function sizeHdr(){ document.documentElement.style.setProperty('--hdr',($('#hdr').getBoundingClientRect().bottom)+'px'); if(map) map.invalidateSize(); }
function update(){ renderChips(); const l=filtered(); renderList(l); mapTouched=false; drawMarkers(l); sizeHdr(); }

document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{ lang=b.dataset.lang; try{localStorage.setItem('tp-lang',lang)}catch(e){}
  renderStatic(); update(); if(openId!==null){ const sc=$('#sheet').scrollTop; openSheet(openId); $('#sheet').scrollTop=sc; } });
$('#sort').onchange=e=>{
  const v=e.target.value;
  if(v==='near'){
    const fail=()=>{ alert(L().geoErr); st.sort='area'; try{localStorage.setItem('tp-sort','area')}catch(e){} renderStatic(); update(); };
    if(!navigator.geolocation){ fail(); return; }
    $('#count').textContent=L().geoWait;
    navigator.geolocation.getCurrentPosition(p=>{ me=[p.coords.latitude,p.coords.longitude]; st.sort='near'; update(); }, fail, {enableHighAccuracy:false,timeout:10000,maximumAge:300000});
    return;
  }
  st.sort=v; try{localStorage.setItem('tp-sort',v)}catch(e){} update();
};
let t; $('#q').addEventListener('input',e=>{clearTimeout(t);t=setTimeout(()=>{st.q=e.target.value.trim();update()},150)});
$('#savedBtn').onclick=()=>{st.saved=!st.saved;$('#savedBtn').setAttribute('aria-pressed',st.saved);if(st.saved){st.cat='All';st.sub='All'}update()};
window.addEventListener('resize',sizeHdr);
renderStatic(); setView('list'); initMap(); update();
})();
</script>

</body></html>
